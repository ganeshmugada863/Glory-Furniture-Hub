{% extends 'base.html' %}
{% load static %}

{% block title %}Welcome — Glory Furniture Hub{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12 text-center space-y-6">
  <div class="aspect-[16/9] rounded-3xl overflow-hidden bg-gray-950 shadow-warm">
    <img src="{% static 'images/hero_epoxy_teak.jpg' %}" alt="Glory Craftsmanship" class="w-full h-full object-cover opacity-90" />
  </div>

  <div class="space-y-2">
    <h1 class="text-2xl sm:text-3xl font-black text-gray-950">Timeless Heirloom Quality</h1>
    <p class="text-xs text-gray-600 max-w-md mx-auto leading-relaxed">
      Certified 100% seasoned Burma teak wood furniture tailored to your residence in Hyderabad.
    </p>
  </div>

  <div>
    <a href="{% url 'home' %}" class="inline-block px-8 py-3.5 rounded-full bg-gray-950 hover:bg-[#5C3D2E] text-white font-bold text-xs uppercase tracking-wider transition-colors shadow-md">
      Start Exploring Masterworks →
    </a>
  </div>
</div>
{% endblock %}
