{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Welcome to Glory Furniture Hub</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Compiled Tailwind CSS for Glory Furniture Hub -->
  <link rel="stylesheet" href="{% static 'css/glory.css' %}" />
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #FAF7F2;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Full-screen viewport container: fits screen perfectly without scrollbars on desktop */
    .welcome-viewport {
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FAF7F2;
      position: relative;
      overflow: hidden;
    }

    /* Fixed Aspect Ratio Stage: guarantees pixel-perfect hotspot alignment on any resolution */
    .welcome-stage {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (1024 / 682));
      max-height: calc(100vw * (682 / 1024));
      aspect-ratio: 1024 / 682;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .welcome-viewport {
        justify-content: flex-start;
        padding-top: 12px;
      }
      .welcome-stage {
        max-width: 100vw;
        max-height: calc(100vw * (682 / 1024));
      }
    }

    .active-tap:active {
      transform: scale(0.97);
      transition: transform 0.1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-stage-fade {
      animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="selection:bg-[#9E4B1E] selection:text-white">

  <!-- ===================================================================== -->
  <!-- FULL SCREEN WELCOME PAGE WITH EXACT REFERENCE IMAGE                   -->
  <!-- ===================================================================== -->
  <main class="welcome-viewport">
    
    <!-- Flash Messages Toast Notification (e.g. Logout, Status) -->
    {% if messages %}
    <div class="absolute top-3 z-50 max-w-md px-4 w-full">
      {% for message in messages %}
      <div class="p-3 rounded-2xl text-xs font-semibold flex items-center justify-between shadow-lg {% if message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200{% else %}bg-[#F5EFE6] text-[#7A3E1D] border border-[#E8DEC0]{% endif %} animate-stage-fade">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 shrink-0 text-[#9E4B1E]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>{{ message }}</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-700 ml-2">&times;</button>
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <!-- Exact Stage Container -->
    <div class="welcome-stage animate-stage-fade">
      
      <!-- 1. The Exact High-Resolution Image -->
      <img 
        src="{% static 'images/welcome_exact_hero.jpg' %}" 
        alt="Welcome to Glory Furniture Hub" 
        class="w-full h-full object-contain pointer-events-none select-none shadow-2xs"
        loading="eager"
      />

      <!-- 2. Interactive Clickable Hotspot over "Get Started →" Button -->
      <!-- Exact coordinates in 1024x682: left: 5.76%, top: 53.23%, width: 34.47%, height: 8.65% -->
      <a 
        href="{% url 'register' %}" 
        id="welcome-get-started-btn"
        title="Get Started — Create Account"
        aria-label="Get Started"
        style="position: absolute; left: 5.76%; top: 53.23%; width: 34.47%; height: 8.65%; border-radius: 9999px; cursor: pointer; z-index: 30;"
        class="group active-tap focus:outline-none focus:ring-4 focus:ring-[#9E4B1E]/40 transition-all duration-200"
      >
        <!-- Subtle interactive hover glow -->
        <span class="block w-full h-full rounded-full opacity-0 group-hover:opacity-10 bg-white transition-opacity duration-200"></span>
        <span class="sr-only">Get Started</span>
      </a>

      <!-- 3. Interactive Clickable Hotspot over "English ⌵" Language Pill -->
      <!-- Exact coordinates in 1024x682: left: 84.77%, top: 3.52%, width: 10.84%, height: 5.43% -->
      <div 
        style="position: absolute; left: 84.77%; top: 3.52%; width: 10.84%; height: 5.43%; z-index: 30;" 
        id="lang-dropdown-wrapper"
      >
        <button 
          type="button" 
          onclick="toggleLanguageMenu(event)"
          id="welcome-lang-btn"
          title="Select Language"
          aria-label="Language Selector"
          aria-expanded="false"
          aria-haspopup="true"
          class="w-full h-full rounded-full cursor-pointer hover:bg-black/5 active-tap focus:outline-none focus:ring-2 focus:ring-[#9E4B1E]/40 transition-colors"
        >
          <span class="sr-only">Language: English</span>
        </button>

        <!-- Dropdown Menu -->
        <div 
          id="lang-menu" 
          class="hidden absolute right-0 mt-2 w-36 bg-white rounded-2xl shadow-xl border border-[#E8DEC0] py-1.5 z-50 text-xs font-medium font-sans"
        >
          <button type="button" onclick="selectLanguage('English')" class="w-full text-left px-4 py-2 hover:bg-[#FAF7F2] text-[#1F1A17] font-bold flex items-center justify-between">
            <span>English</span>
            <span class="text-[#9E4B1E] font-bold">&check;</span>
          </button>
          <button type="button" onclick="selectLanguage('Telugu')" class="w-full text-left px-4 py-2 hover:bg-[#FAF7F2] text-[#2A231E]">
            <span>తెలుగు</span>
          </button>
          <button type="button" onclick="selectLanguage('Hindi')" class="w-full text-left px-4 py-2 hover:bg-[#FAF7F2] text-[#2A231E]">
            <span>हिंदी</span>
          </button>
        </div>
      </div>

      <!-- 4. Interactive Clickable Hotspot over Top-Left Logo to Refresh/Home -->
      <a 
        href="{% url 'welcome' %}" 
        style="position: absolute; left: 4%; top: 3%; width: 22%; height: 10%; border-radius: 12px; cursor: pointer; z-index: 25;"
        title="Glory Furniture Hub"
        aria-label="Glory Furniture Hub"
      >
        <span class="sr-only">Glory Furniture Hub</span>
      </a>

    </div>

    <!-- Mobile-Optimized Action Bar (Visible on mobile screens for effortless tapping) -->
    <div class="sm:hidden w-full px-6 pt-3 pb-6 flex flex-col items-center gap-2.5 z-30">
      <a 
        href="{% url 'register' %}" 
        class="w-full max-w-sm py-3.5 px-6 rounded-2xl bg-[#9E4B1E] hover:bg-[#833D16] text-white font-bold text-base shadow-md active-tap flex items-center justify-center gap-2.5 text-center transition-all duration-200"
      >
        <span>Get Started</span>
        <svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>

      <p class="text-xs text-[#8C7A6B] font-medium text-center">
        Already registered? 
        <a href="{% url 'login' %}" class="font-bold text-[#9E4B1E] hover:underline ml-1">
          Log in &rarr;
        </a>
      </p>
    </div>

  </main>

  <!-- Interactive Scripts -->
  <script>
    function toggleLanguageMenu(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('lang-menu');
      const btn = document.getElementById('welcome-lang-btn');
      if (menu) {
        const isHidden = menu.classList.contains('hidden');
        menu.classList.toggle('hidden');
        if (btn) btn.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
      }
    }

    function selectLanguage(lang) {
      const menu = document.getElementById('lang-menu');
      if (menu) menu.classList.add('hidden');
      const btn = document.getElementById('welcome-lang-btn');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }

    // Close language menu on outside click
    document.addEventListener('click', function(e) {
      const wrapper = document.getElementById('lang-dropdown-wrapper');
      const menu = document.getElementById('lang-menu');
      if (wrapper && !wrapper.contains(e.target) && menu && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        const btn = document.getElementById('welcome-lang-btn');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      }
    });

    // Keyboard support: Enter / Space triggers Get Started
    document.addEventListener('keydown', function(e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'welcome-get-started-btn') {
        window.location.href = "{% url 'register' %}";
      }
    });
  </script>
</body>
</html>
