{% extends 'base.html' %}
{% load static %}

{% block title %}Glory Furniture Hub{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col items-center justify-center p-6 text-center space-y-4">
  <div class="w-20 h-20 rounded-2xl overflow-hidden shadow-warm border border-gray-200">
    <img src="{% static 'images/logo_wood.jpg' %}" alt="Glory Furniture" class="w-full h-full object-cover" />
  </div>
  <h1 class="text-3xl font-black text-gray-950 tracking-wider">GLORY FURNITURE HUB</h1>
  <p class="text-xs text-[#C9963F] font-bold uppercase tracking-[0.2em]">Handcrafted Solid Teak Furniture</p>
  <div class="pt-4">
    <a href="{% url 'home' %}" class="px-8 py-3 rounded-full bg-gray-950 text-white font-bold text-xs uppercase tracking-wider">
      Enter Storefront →
    </a>
  </div>
</div>
{% endblock %}
