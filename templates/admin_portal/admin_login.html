{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Admin Authentication — Glory Furniture Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/glory.css' %}" />
</head>
<body class="bg-[#140D09] text-white min-h-screen flex items-center justify-center p-4 font-sans selection:bg-[#C9963F] selection:text-gray-950">

  <div class="w-full max-w-md bg-[#1F150F] rounded-3xl p-8 border border-amber-950/60 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-[#C9963F] text-gray-950 flex items-center justify-center font-black text-2xl mx-auto shadow-md">
        👑
      </div>
      <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">Studio Admin Portal</h1>
      <p class="text-xs text-amber-200/70">Enter administrator credentials to access the central management console.</p>
    </div>

    {% if error %}
    <div class="p-3 rounded-xl bg-red-950/80 border border-red-800 text-red-200 text-xs font-semibold">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-amber-100/80 mb-1.5">Admin Email / Username</label>
        <input type="text" 
               name="email" 
               required 
               value="admin@gloryfurniture.com" 
               placeholder="admin@gloryfurniture.com" 
               class="w-full px-4 py-3 rounded-xl bg-[#140D09] border border-amber-950/80 focus:border-[#C9963F] text-white text-xs font-semibold focus:outline-none transition-all" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-amber-100/80 mb-1.5">Security Password</label>
        <input type="password" 
               name="password" 
               required 
               value="admin123" 
               placeholder="••••••••" 
               class="w-full px-4 py-3 rounded-xl bg-[#140D09] border border-amber-950/80 focus:border-[#C9963F] text-white text-xs font-semibold focus:outline-none transition-all" />
      </div>

      <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-[#C9963F] hover:bg-[#b58330] text-gray-950 text-xs font-black uppercase tracking-wider transition-all shadow-md active:scale-95 cursor-pointer">
        Enter Admin Console →
      </button>
    </form>

    <div class="pt-4 border-t border-amber-950/60 text-center">
      <a href="{% url 'home' %}" class="text-[11px] font-semibold text-amber-400 hover:underline">
        ← Return to Customer Storefront
      </a>
    </div>

  </div>

</body>
</html>
