{% extends 'admin_portal/admin_base.html' %}

{% block title %}Studio Settings — Glory Furniture Hub{% endblock %}

{% block content %}
<div class="space-y-6 max-w-3xl">
  <div>
    <h1 class="text-2xl font-black text-gray-950 tracking-tight">Studio Configuration</h1>
    <p class="text-xs text-gray-500">Manage payment gateway credentials, workshop addresses, and contact channels.</p>
  </div>

  <div class="bg-white rounded-2xl border border-gray-200 p-6 space-y-4">
    <h2 class="text-xs font-black uppercase text-gray-400 tracking-wider">UPI Payment Gateway</h2>
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">Payee UPI VPA</label>
      <input type="text" value="{{ upi_vpa }}" readonly class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-xs font-mono font-bold bg-gray-50" />
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-gray-200 p-6 space-y-4">
    <h2 class="text-xs font-black uppercase text-gray-400 tracking-wider">Studio &amp; Workshop Contact</h2>
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">Workshop Phone</label>
      <input type="text" value="{{ studio_phone }}" readonly class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-xs font-bold bg-gray-50" />
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">Central Workshop Address</label>
      <textarea readonly class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-xs font-medium bg-gray-50">{{ studio_address }}</textarea>
    </div>
  </div>
</div>
{% endblock %}
