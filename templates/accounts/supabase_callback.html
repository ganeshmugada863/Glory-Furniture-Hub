{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifying Google Authentication — Glory Furniture Hub</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Compiled Tailwind CSS for Glory Furniture Hub -->
  <link rel="stylesheet" href="{% static 'css/glory.css' %}" />
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}" />

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="bg-[#FAF7F2] text-gray-900 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl p-8 border border-amber-200/80 shadow-warm text-center space-y-6">
    <!-- Brand Crest -->
    <div class="w-16 h-16 rounded-2xl bg-amber-50 border border-amber-200 flex items-center justify-center mx-auto overflow-hidden shadow-2xs">
      <img src="{% static 'images/logo_wood.jpg' %}" alt="Glory Furniture" class="w-full h-full object-cover" />
    </div>

    <div class="space-y-2">
      <h1 class="text-xl font-black text-gray-950 tracking-tight">Authenticating with Google</h1>
      <p id="status-msg" class="text-xs text-gray-500 font-medium">Verifying your Google credentials with Glory Furniture Hub...</p>
    </div>

    <!-- Spinner -->
    <div class="flex justify-center items-center py-4">
      <div class="w-10 h-10 border-3 border-amber-200 border-t-[#5C3D2E] rounded-full animate-spin"></div>
    </div>

    <p class="text-[11px] text-gray-400">Please wait while we redirect you to the storefront...</p>
  </div>

  <script>
    // Fail-safe redirect: If callback landed on Render, bounce immediately to Vercel with all parameters
    if (window.location.hostname.includes('onrender.com')) {
      const vercelTarget = 'https://glory-furniture-hub.vercel.app' + window.location.pathname + window.location.search + window.location.hash;
      window.location.replace(vercelTarget);
    }

    const SUPABASE_URL = 'https://qxxrghelhlrafdkveeqo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4eHJnaGVsaGxyYWZka3ZlZXFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDMwNTEsImV4cCI6MjEwNDAxOTA1MX0.mc-5c84wqAaD5_ybaHS_vHZSYgczA2bIjWC2KwIPfZA';

    let supabaseClient = null;
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (e) {
      console.error("Supabase client init error:", e);
    }

    let isExchanged = false;

    function getCsrfToken() {
      let cookieValue = '';
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, 10) === 'csrftoken=') {
            cookieValue = decodeURIComponent(cookie.substring(10));
            break;
          }
        }
      }
      return cookieValue;
    }

    async function exchangeWithDjango(session) {
      if (isExchanged) return;
      isExchanged = true;

      const user = (session && session.user) ? session.user : {};
      const meta = user.user_metadata || {};
      const payload = {
        email: user.email || '',
        name: meta.full_name || meta.name || (user.email ? user.email.split('@')[0] : 'Glory Customer'),
        google_id: user.id || '',
        avatar_url: meta.avatar_url || meta.picture || '',
        access_token: (session && session.access_token) ? session.access_token : ''
      };

      document.getElementById('status-msg').innerText = "Logging in as " + (payload.name || 'Customer') + "...";

      try {
        const res = await fetch('/accounts/google-auth/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken()
          },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.status === 'success') {
          document.getElementById('status-msg').innerText = "Success! Redirecting to Glory Furniture Home...";
          let returnUrl = localStorage.getItem('glory_auth_return_url') || result.redirect_url || '/';
          if (returnUrl.includes('onrender.com')) {
            returnUrl = 'https://glory-furniture-hub.vercel.app/';
          }
          try { localStorage.removeItem('glory_auth_return_url'); } catch (e) {}
          setTimeout(() => {
            window.location.href = returnUrl;
          }, 350);
        } else {
          document.getElementById('status-msg').innerHTML = `<span class="text-red-700 font-bold">Authentication Note:</span> ${result.message || 'Could not complete login'}<br/><a href="/login/" class="mt-3 inline-block px-4 py-2 bg-[#5C3D2E] text-white text-xs rounded-xl font-bold">Return to Sign In</a>`;
        }
      } catch (err) {
        console.error("Backend login error:", err);
        document.getElementById('status-msg').innerHTML = `<span class="text-amber-800 font-bold">Connection finalized.</span><br/><a href="/" class="mt-3 inline-block px-4 py-2 bg-[#5C3D2E] text-white text-xs rounded-xl font-bold">Continue to Storefront →</a>`;
        setTimeout(() => { window.location.href = '/'; }, 2000);
      }
    }

    async function initAuthProcessing() {
      if (!supabaseClient) {
        document.getElementById('status-msg').innerText = "Supabase initialization failed.";
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const authError = urlParams.get('error_description') || urlParams.get('error');

      if (authError) {
        document.getElementById('status-msg').innerText = "Google Authentication was not completed: " + authError;
        setTimeout(() => { window.location.href = '/login/'; }, 3000);
        return;
      }

      // 1. If PKCE flow returned ?code=..., exchange it for session
      if (code) {
        document.getElementById('status-msg').innerText = "Exchanging authorization code...";
        try {
          const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
          if (data && data.session && data.session.user) {
            await exchangeWithDjango(data.session);
            return;
          }
          if (error) {
            console.warn("exchangeCodeForSession error:", error);
          }
        } catch (codeErr) {
          console.warn("exchangeCodeForSession exception:", codeErr);
        }
      }

      // 2. Parse URL hash if direct access_token returned
      const hash = window.location.hash.substring(1);
      if (hash) {
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');
        if (accessToken) {
          // A. Try getUser from token
          try {
            const { data, error } = await supabaseClient.auth.getUser(accessToken);
            if (data && data.user) {
              await exchangeWithDjango({ access_token: accessToken, user: data.user });
              return;
            }
          } catch (tokenErr) {
            console.warn("getUser from token error:", tokenErr);
          }
          // B. Direct client-side JWT payload extraction
          try {
            const parts = accessToken.split('.');
            if (parts.length >= 2) {
              const b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
              const jsonPayload = decodeURIComponent(atob(b64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
              const payload = JSON.parse(jsonPayload);
              const userObj = {
                id: payload.sub,
                email: payload.email,
                user_metadata: payload.user_metadata || {}
              };
              await exchangeWithDjango({ access_token: accessToken, user: userObj });
              return;
            }
          } catch (jwtErr) {
            console.warn("Direct JWT parse error:", jwtErr);
          }
          // C. Backend fallback with token
          await exchangeWithDjango({ access_token: accessToken, user: {} });
          return;
        }
      }

      // 3. Check current session
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          await exchangeWithDjango(session);
          return;
        }
      } catch (err) {
        console.warn("getSession error:", err);
      }

      // 4. Listen for auth state change
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (session && session.user) {
          await exchangeWithDjango(session);
        }
      });

      // Safety timeout: If auth exchange didn't complete after 8 seconds, don't leave user stranded
      setTimeout(() => {
        if (!isExchanged) {
          const statusEl = document.getElementById('status-msg');
          if (statusEl) {
            statusEl.innerHTML = `<span class="text-gray-700">Authentication is taking longer than expected.</span><div class="mt-3 flex items-center justify-center gap-2"><a href="/" class="px-4 py-2 bg-[#5C3D2E] text-white text-xs rounded-xl font-bold">Go to Storefront</a><a href="/login/" class="px-4 py-2 bg-gray-200 text-gray-800 text-xs rounded-xl font-bold">Try Sign In Again</a></div>`;
          }
        }
      }, 8000);
    }

    document.addEventListener('DOMContentLoaded', initAuthProcessing);
  </script>
</body>
</html>
