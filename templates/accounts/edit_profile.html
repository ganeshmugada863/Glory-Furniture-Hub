{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Profile — Glory Furniture Hub{% endblock %}

{% block back_bar %}
<div class="w-full bg-[#FAF7F4] border-t border-b border-gray-200/80 px-4 sm:px-6 lg:px-10 py-2.5 flex items-center justify-between shadow-2xs relative z-20">
  <div class="flex items-center gap-3 flex-shrink-0">
    <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='{% url 'profile' %}';" class="p-1.5 -ml-1 rounded-full hover:bg-gray-200 text-gray-800 hover:text-gray-950 transition-colors active-tap flex items-center justify-center flex-shrink-0" aria-label="Go back">
      <svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    </button>
    <span class="text-xs sm:text-sm font-bold text-gray-800 border-l border-gray-300 pl-3 leading-none">
      Edit Profile & Delivery Address
    </span>
  </div>
</div>
{% endblock %}

{% block content %}
<div class="w-full max-w-xl mx-auto px-4 py-8">
  <div class="bg-white rounded-3xl p-6 sm:p-8 border border-gray-200/80 shadow-warm space-y-6">
    <h1 class="text-xl font-black text-gray-950">Update Information</h1>

    <form method="POST" action="{% url 'edit_profile' %}" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Full Name</label>
        <input type="text" name="name" value="{{ USER_NAME }}" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-xs text-gray-900" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Phone / WhatsApp</label>
        <input type="tel" name="phone" value="{{ USER_PHONE }}" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-xs text-gray-900" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Primary Delivery Address</label>
        <textarea name="address" rows="3" placeholder="Enter full delivery address" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 text-xs text-gray-900">{{ user_address|default:request.user.profile.address|default:'' }}</textarea>
      </div>

      <button type="submit" class="w-full py-3.5 rounded-full bg-gray-950 hover:bg-[#5C3D2E] text-white text-xs font-bold uppercase tracking-wider transition-colors shadow-md active-tap">
        Save Changes →
      </button>
    </form>
  </div>
</div>
{% endblock %}
