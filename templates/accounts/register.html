{% extends 'base.html' %}
{% load static %}

{% block title %}Create Account — Glory Furniture Hub{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto px-4 py-12">
  <div class="bg-white rounded-3xl p-6 sm:p-8 border border-gray-200/80 shadow-warm space-y-6">
    <div class="text-center space-y-2">
      <h1 class="text-xl font-black text-gray-950">Join Glory Furniture Hub</h1>
      <p class="text-xs text-gray-500">Access exclusive handcrafted teak collections and customized consultations</p>
    </div>

    <form method="POST" action="{% url 'register' %}" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Full Name</label>
        <input type="text" name="name" placeholder="Ganesh M." required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-xs text-gray-900" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Email Address</label>
        <input type="email" name="email" placeholder="ganesh@example.com" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-xs text-gray-900" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Phone / WhatsApp</label>
        <input type="tel" name="phone" placeholder="+91 98765 43210" required class="w-full px-4 py-3 rounded-xl border border-gray-300 text-xs text-gray-900" />
      </div>

      <button type="submit" class="w-full py-3.5 rounded-full bg-gray-950 hover:bg-[#5C3D2E] text-white text-xs font-bold uppercase tracking-wider transition-colors shadow-md active-tap">
        Create Account & Continue →
      </button>
    </form>

    <div class="text-center text-xs text-gray-500 pt-2 border-t border-gray-100">
      Already have an account? <a href="{% url 'login' %}" class="font-bold text-[#5C3D2E] hover:underline">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
